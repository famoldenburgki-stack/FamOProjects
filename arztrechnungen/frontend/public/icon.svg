<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Arztrechnungen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Abgerundete Kachel als Grundform -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Rechnungsblatt mit umgeknickter Ecke -->
  <path d="M18 13h20l10 10v28a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z" fill="#ffffff"/>
  <path d="M38 13l10 10H40a2 2 0 0 1-2-2z" fill="#bfdbfe"/>

  <!-- Rechnungszeilen, die letzte kürzer als Summenzeile -->
  <g fill="#93c5fd">
    <rect x="24" y="28" width="18" height="2.6" rx="1.3"/>
    <rect x="24" y="34" width="14" height="2.6" rx="1.3"/>
  </g>

  <!-- Grünes Häkchen: geprüft und erstattet -->
  <circle cx="41" cy="44" r="9.5" fill="#16a34a"/>
  <path d="M36.6 44.2l3 3 5.4-5.8" fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
